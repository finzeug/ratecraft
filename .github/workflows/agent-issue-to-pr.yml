name: agent-issue-to-pr
# Thin wrapper (home-infra#123): owns the `issues: [labeled]` trigger and the
# agent-pr label filter; the pipeline itself is the dev-common reusable (one
# source of truth, same shape as tag-version + agent-pr-revise).
#
# gate_cmd is empty: this repo is not in the svc-dev tier, so there is no
# deploy+smoke gate to run. An empty gate also disables agent-deploy auto-merge
# in the reusable, which is why this repo carries only the agent-pr label --
# the agent opens a PR and a human merges it (same posture as home-infra).
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write        # push the agent's branch
  pull-requests: write   # open the PR
  issues: write          # comment status back on the issue
  statuses: write        # gate commit status (unused here; harmless)
  id-token: write        # claude-code-action mints a GitHub OIDC token

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    # NOTE: every line below `if: >` is DATA, not YAML. A `#` inside a folded
    # scalar is not a comment -- it folds into the expression string, GitHub
    # rejects the expression, and the ENTIRE workflow file stops parsing. That
    # is why these notes live above the key and must stay there. The failure is
    # invisible: an unparseable workflow yields a run with ZERO jobs, so nothing
    # goes red and the wrapper audit still counts the run as a conclusion.
    # See bdh-org/home-infra#469.
    #
    # What the expression says: fire on the agent-pr/agent-deploy labels (this
    # repo carries only agent-pr, since an empty gate disables agent-deploy
    # auto-merge anyway), or on an issue comment from a trusted author. The
    # /agent verb itself is decided by the reusable's gate job, not here -- an
    # expression cannot express "a line that begins with /agent", having no way
    # to write a newline (bdh-org/dev-common#202). The trust gate STAYS here:
    # it is a security boundary and free to evaluate.
    if: >
      (github.event_name == 'issues' &&
      (github.event.label.name == 'agent-pr' || github.event.label.name == 'agent-deploy'))
      ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    uses: bdh-org/dev-common/.github/workflows/agent-issue-to-pr.yml@main
    with:
      # no deployable dev tier -> no gate, no agent-deploy auto-merge
      gate_cmd: ""
    secrets: inherit
