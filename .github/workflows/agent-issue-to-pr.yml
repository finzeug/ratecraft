name: agent-issue-to-pr
# Thin wrapper (home-infra#123): owns the `issues: [labeled]` trigger and the
# agent-pr label filter; the pipeline itself is the dev-common reusable (one
# source of truth, same shape as tag-version + agent-pr-revise).
#
# gate_cmd is empty: this repo is not in the svc-dev tier, so there is no
# deploy+smoke gate to run. An empty gate also disables agent-deploy auto-merge
# in the reusable, which is why this repo carries only the agent-pr label --
# the agent opens a PR and a human merges it (same posture as home-infra).
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write        # push the agent's branch
  pull-requests: write   # open the PR
  issues: write          # comment status back on the issue
  statuses: write        # gate commit status (unused here; harmless)
  id-token: write        # claude-code-action mints a GitHub OIDC token

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: >
      (github.event_name == 'issues' &&
      (github.event.label.name == 'agent-pr' || github.event.label.name == 'agent-deploy'))
      ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      # The /agent verb is decided by the reusable's gate job, not here: an
      # expression cannot express "a line that begins with /agent", having no
      # way to write a newline (bdh-org/dev-common#202). The trust gate below
      # STAYS -- it is a security boundary and free to evaluate.
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    uses: bdh-org/dev-common/.github/workflows/agent-issue-to-pr.yml@main
    with:
      # no deployable dev tier -> no gate, no agent-deploy auto-merge
      gate_cmd: ""
    secrets: inherit
