[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ratecraft"
version = "0.1.0"
description = "Fixed income math: bonds, yield curves, duration, and inflation"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["ratecraft*"]

[tool.ruff]
target-version = "py311"
line-length = 120
# The submodules carry their own tooling and are linted in their own repos.
exclude = ["common"]

# Pinned explicitly rather than left to ruff's defaults so a developer's ruff
# and CI's ruff agree on what "clean" means. Without this ratecraft inherited
# whatever the installed ruff selected -- 46 findings on 0.16, none on the
# defaults this repo was written against. Same block as finzeug/ledger-io.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "S101"]  # asserts are the point in tests
